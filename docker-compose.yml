services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-afterapply}
      POSTGRES_USER: ${POSTGRES_USER:-afterapply}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      # Offset from 5432: native Homebrew Postgres already owns 5432 on this host,
      # and 5433 is used by another local project's container. See README.
      - "5434:5432"
    volumes:
      - afterapply-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-afterapply} -d ${POSTGRES_DB:-afterapply}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      # Offset from 6379: already used by another local project's container. See README.
      - "6382:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/AfterApply.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-afterapply};Username=${POSTGRES_USER:-afterapply};Password=${POSTGRES_PASSWORD}"
      ConnectionStrings__Redis: "redis:6379"
      Jwt__SigningKey: "${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env}"
      GoogleAuth__ClientId: "${GOOGLE_CLIENT_ID:-}"
      GoogleAuth__ClientSecret: "${GOOGLE_CLIENT_SECRET:-}"
      LinkedInAuth__ClientId: "${LINKEDIN_CLIENT_ID:-}"
      LinkedInAuth__ClientSecret: "${LINKEDIN_CLIENT_SECRET:-}"
      # Default is the real policy (5/min per IP). The API contract check in CI raises it — its
      # Postman collection fires every /api/auth/* request back to back from one IP, and the 6th
      # would otherwise be a 429 that has nothing to do with the contract being checked.
      RateLimiting__Auth__PermitLimit: "${RATE_LIMITING_AUTH_PERMIT_LIMIT:-5}"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  afterapply-postgres-data:
