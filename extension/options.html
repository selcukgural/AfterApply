<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>e-kariyerim — Settings</title>
  <link rel="stylesheet" href="popup.css" />
  <style>
    body { width: 420px; }
  </style>
</head>
<body>
  <header class="app-header">
    <img class="logo" src="icons/icon48.png" alt="" width="22" height="22" />
    <h1 id="pageHeading">e-kariyerim Settings</h1>
    <button id="langToggle" class="lang-toggle" type="button" aria-label="Toggle language"></button>
    <button id="themeToggle" class="theme-toggle" type="button" aria-label="Toggle theme"></button>
  </header>

  <main id="content">
    <p id="tokenHelp" class="muted">
      Generate an access token from e-kariyerim → Settings → Browser Extension, then paste it below.
    </p>

    <label id="apiBaseUrlLabel" for="apiBaseUrl">API base URL</label>
    <input id="apiBaseUrl" type="text" placeholder="https://api.ekariyerim.com" />

    <label id="tokenLabel" for="token">Access token</label>
    <input id="token" type="password" placeholder="aa_pat_..." />

    <button id="save" class="primary">Save</button>
    <p id="status" class="status" hidden></p>

    <label id="forwardingLabel">Email Forwarding</label>
    <p id="forwardingHelp" class="muted">
      Get automatic status suggestions from your inbox — a full, step-by-step guide (with screenshots) to
      setting up Gmail forwarding.
    </p>
    <button id="openEmailForwarding" class="secondary" type="button">Set up Email Forwarding</button>
  </main>

  <script type="module" src="options.js"></script>
</body>
</html>
