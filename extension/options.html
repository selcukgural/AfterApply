<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>AfterApply — Settings</title>
  <link rel="stylesheet" href="popup.css" />
  <style>
    body { width: 420px; }
  </style>
</head>
<body>
  <h1>AfterApply Settings</h1>
  <p class="muted">
    Generate an access token from AfterApply → Settings → Browser Extension, then paste it below.
  </p>

  <label for="apiBaseUrl">API base URL</label>
  <input id="apiBaseUrl" type="text" placeholder="http://localhost:5151" />

  <label for="token">Access token</label>
  <input id="token" type="password" placeholder="aa_pat_..." />

  <button id="save">Save</button>
  <p id="status" class="status" hidden></p>

  <script type="module" src="options.js"></script>
</body>
</html>
