# Version updates for every ecosystem the build pulls code from. Security updates are a repository
# setting and arrive regardless; this file is what keeps the pins (action SHAs, image digests,
# lockfiles) from quietly aging. Weekly, minor and patch grouped per ecosystem so a week's
# updates are one PR to review rather than twenty.
#
# Majors are never proposed (2026-09-24): a major is a planned change — read its notes, move
# the things that share it together (Node image + CI setup-node, codeql init + analyze,
# StackExchange.Redis + the packages built on it) — not a PR to click through. At most two open
# PRs per ecosystem. Security updates are separate and not limited by this file.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      # init and analyze must run the same version (analyze refuses a config written by another),
      # so they move together. Listed first: a dependency joins the first group that matches.
      codeql:
        patterns: ["github/codeql-action*"]
      actions:
        update-types: [minor, patch]

  # Central package management: Directory.Packages.props at the root holds every version.
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      nuget:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      web:
        update-types: [minor, patch]

  # A version bump here is a Chrome Web Store release (extension/CLAUDE.md), so these PRs are
  # batched into the next extension release rather than merged on their own.
  - package-ecosystem: npm
    directory: /extension
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      extension:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /postman
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      postman:
        update-types: [minor, patch]

  # Base images are pinned by digest; these move the digest (and the tag, for a new release).
  - package-ecosystem: docker
    directories:
      - /src/AfterApply.Api
      - /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      images:
        update-types: [minor, patch]
