name: Deploy (Cloud Run)

# A push to main auto-deploys only the side(s) whose paths actually changed
# (see the `plan` job's paths-filter, same filters as
# slack-pr-notify.yml's `backend` list plus a `web` one) — most changes only
# touch one side, so redeploying the other unconditionally was wasted build
# time. `workflow_dispatch` still exists for manual/forced redeploys (e.g.
# after a secret rotation with no code change) via the `target` input.
# DECISIONS.md 2026-09-01 has the full rationale; supersedes Sprint 13's
# "workflow_dispatch-only on purpose" decision now that the GCP infra is
# live and verified end-to-end.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Which side(s) to deploy
        type: choice
        options: [both, backend, web]
        default: both

permissions:
  id-token: write # Workload Identity Federation — no long-lived JSON key stored in secrets
  contents: read

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: ${{ secrets.GCP_REGION }}
  AR_REPOSITORY: afterapply

jobs:
  # Decides which side(s) should deploy: on a push, diff the paths that changed; on a manual
  # dispatch, the `target` input states intent directly, no diffing needed.
  plan:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.decide.outputs.backend }}
      web: ${{ steps.decide.outputs.web }}
    steps:
      - uses: actions/checkout@v5
        if: github.event_name == 'push'

      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'push'
        with:
          filters: |
            backend:
              - 'src/**'
              - 'tests/**'
              - 'AfterApply.slnx'
              - 'Directory.Build.props'
              - 'Directory.Packages.props'
              - 'global.json'
            web:
              - 'web/**'

      - id: decide
        env:
          TARGET: ${{ inputs.target }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            [ "$TARGET" = "backend" ] || [ "$TARGET" = "both" ] && backend=true || backend=false
            [ "$TARGET" = "web" ] || [ "$TARGET" = "both" ] && web=true || web=false
          else
            backend="${{ steps.filter.outputs.backend }}"
            web="${{ steps.filter.outputs.web }}"
          fi
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "web=$web" >> "$GITHUB_OUTPUT"

  # Re-verifies the API against its own Postman collection right before deploying — a second,
  # independent gate from ci.yml's own call to the same reusable workflow, since this workflow
  # can be dispatched against any commit/branch, not just one CI already passed on. Skipped
  # entirely when neither side is deploying (e.g. a docs-only push to main).
  contract-check:
    needs: plan
    if: needs.plan.outputs.backend == 'true' || needs.plan.outputs.web == 'true'
    uses: ./.github/workflows/api-contract.yml

  deploy-backend:
    needs: [plan, contract-check]
    if: needs.plan.outputs.backend == 'true'
    runs-on: ubuntu-latest
    # contents: write (job-level, overrides the workflow's contents: read) is only for moving
    # the deploy/api-latest tag below — the actual deploy steps still just need id-token: write.
    permissions:
      id-token: write
      contents: write
    outputs:
      commits: ${{ steps.deploy-commits.outputs.commits }}
      count: ${{ steps.deploy-commits.outputs.count }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history — needed to diff against the deploy/api-latest tag below

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Build and push image
        run: |
          IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${AR_REPOSITORY}/afterapply-api:${GITHUB_SHA}"
          docker build -f src/AfterApply.Api/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      # Applies any pending EF Core migrations before the api service below
      # gets the new image, so new code never sees an old schema. Runs as a
      # Cloud Run Job (not a GitHub Actions step) specifically so the DB
      # password never leaves GCP — the job reads
      # ConnectionStrings__Postgres from Secret Manager itself via its own
      # runtime identity, the same way the api service already does below.
      # `dotnet ef database update` (what the bundle runs) is idempotent —
      # it only applies migrations missing from __EFMigrationsHistory, so
      # running it on every deploy is a no-op when nothing changed. See
      # src/AfterApply.Api/Dockerfile.migrate and DEPLOYMENT.md
      # "Migrations".
      - name: Build and push migration image
        run: |
          MIGRATE_IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${AR_REPOSITORY}/afterapply-migrate:${GITHUB_SHA}"
          docker build -f src/AfterApply.Api/Dockerfile.migrate -t "$MIGRATE_IMAGE" .
          docker push "$MIGRATE_IMAGE"
          echo "MIGRATE_IMAGE=$MIGRATE_IMAGE" >> "$GITHUB_ENV"

      - name: Run pending migrations
        run: |
          gcloud run jobs deploy afterapply-migrate \
            --image="${MIGRATE_IMAGE}" \
            --region="${GCP_REGION}" \
            --set-cloudsql-instances="${GCP_PROJECT_ID}:${GCP_REGION}:afterapply-db" \
            --set-secrets="ConnectionStrings__Postgres=afterapply-postgres-connection:latest" \
            --max-retries=0 \
            --task-timeout=600 \
            --quiet
          gcloud run jobs execute afterapply-migrate --region="${GCP_REGION}" --wait

      # Values on the right of `=` in `secrets:` are Secret Manager secret
      # names (not the secret values themselves) — see DEPLOYMENT.md for
      # how to create them. Empty-string-disables-safely secrets (Sentry,
      # OpenAI) still go through Secret Manager for consistency, not
      # because they're sensitive when empty.
      #
      # `flags` wires up the two GCP-specific connections (DECISIONS.md
      # "Postgres + Redis + web de Google Cloud'a taşındı"):
      #  - `--add-cloudsql-instances` is Cloud Run's built-in Cloud SQL
      #    connector (no proxy sidecar) — Npgsql then connects over the
      #    Unix socket it mounts at /cloudsql/<instance-connection-name>.
      #  - `--network`/`--subnet` enable Direct VPC Egress so Cloud Run
      #    can reach Memorystore's private IP (Memorystore has no public
      #    IP at all). Both reference the project's default VPC/subnet —
      #    no custom VPC was created for this.
      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: afterapply-api
          region: ${{ env.GCP_REGION }}
          image: ${{ env.IMAGE }}
          flags: >-
            --add-cloudsql-instances=${{ env.GCP_PROJECT_ID }}:${{ env.GCP_REGION }}:afterapply-db
            --network=default
            --subnet=default
          env_vars: |-
            ASPNETCORE_ENVIRONMENT=Production
            ASPNETCORE_URLS=http://+:8080
          secrets: |-
            ConnectionStrings__Postgres=afterapply-postgres-connection:latest
            ConnectionStrings__Redis=afterapply-redis-connection:latest
            Jwt__SigningKey=afterapply-jwt-signing-key:latest
            Sentry__Dsn=afterapply-sentry-dsn:latest
            OpenAI__ApiKey=afterapply-openai-api-key:latest
            Resend__ApiKey=afterapply-resend-api-key:latest
            Cors__AllowedOrigins__0=afterapply-web-origin:latest
            App__WebBaseUrl=afterapply-web-origin:latest

      # High-water-mark tag for the notify-deploy job below: moves deploy/api-latest to the
      # commit that was just deployed, so the *next* backend deploy can compute exactly which
      # commits shipped by diffing against it (git log deploy/api-latest..HEAD) — this survives
      # any number of intervening pushes that didn't touch backend paths and so never deployed,
      # unlike just looking at this push's own commit list. First-ever run (tag doesn't exist
      # yet) falls back to reporting just the current commit.
      - name: Compute deployed commit range
        id: deploy-commits
        run: |
          git fetch origin 'refs/tags/deploy/api-latest:refs/tags/deploy/api-latest' 2>/dev/null || true
          REPO_URL="${{ github.server_url }}/${{ github.repository }}"
          if git rev-parse -q --verify refs/tags/deploy/api-latest >/dev/null; then
            RANGE=(deploy/api-latest..HEAD)
          else
            RANGE=(-1 HEAD)
          fi
          COMMITS=$(git log "${RANGE[@]}" --pretty=format:"• <${REPO_URL}/commit/%H|\`%h\`> %s — %an")
          {
            echo "commits<<COMMITS_EOF"
            echo "$COMMITS"
            echo "COMMITS_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "count=$(printf '%s\n' "$COMMITS" | sed '/^$/d' | wc -l | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Move deploy/api-latest tag
        run: |
          git tag -f deploy/api-latest HEAD
          git push origin refs/tags/deploy/api-latest --force

  deploy-web:
    needs: [plan, contract-check]
    if: needs.plan.outputs.web == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    outputs:
      commits: ${{ steps.deploy-commits.outputs.commits }}
      count: ${{ steps.deploy-commits.outputs.count }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history — needed to diff against the deploy/web-latest tag below

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      # NEXT_PUBLIC_API_BASE_URL is the api Cloud Run service's URL — set
      # once as a repo secret after that service's first deploy (Cloud Run
      # URLs are stable for the life of the service, so this doesn't need
      # to be rediscovered on every run). See DEPLOYMENT.md step 4/5.
      - name: Build and push image
        run: |
          IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${AR_REPOSITORY}/afterapply-web:${GITHUB_SHA}"
          docker build -f web/Dockerfile \
            --build-arg NEXT_PUBLIC_API_BASE_URL="${{ secrets.GCP_API_URL }}" \
            --build-arg NEXT_PUBLIC_SENTRY_DSN="${{ secrets.SENTRY_DSN_WEB }}" \
            --build-arg SENTRY_ORG="${{ secrets.SENTRY_ORG }}" \
            --build-arg SENTRY_PROJECT="${{ secrets.SENTRY_PROJECT_WEB }}" \
            --build-arg SENTRY_AUTH_TOKEN="${{ secrets.SENTRY_AUTH_TOKEN }}" \
            -t "$IMAGE" ./web
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      # No --add-cloudsql-instances/--network/--subnet here — the web
      # service only talks to the api service over HTTPS
      # (NEXT_PUBLIC_API_BASE_URL, baked in above), never directly to
      # Postgres or Redis.
      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: afterapply-web
          region: ${{ env.GCP_REGION }}
          image: ${{ env.IMAGE }}

      # Same high-water-mark pattern as deploy-backend's own step above, just against
      # deploy/web-latest — see that step's comment for the full rationale.
      - name: Compute deployed commit range
        id: deploy-commits
        run: |
          git fetch origin 'refs/tags/deploy/web-latest:refs/tags/deploy/web-latest' 2>/dev/null || true
          REPO_URL="${{ github.server_url }}/${{ github.repository }}"
          if git rev-parse -q --verify refs/tags/deploy/web-latest >/dev/null; then
            RANGE=(deploy/web-latest..HEAD)
          else
            RANGE=(-1 HEAD)
          fi
          COMMITS=$(git log "${RANGE[@]}" --pretty=format:"• <${REPO_URL}/commit/%H|\`%h\`> %s — %an")
          {
            echo "commits<<COMMITS_EOF"
            echo "$COMMITS"
            echo "COMMITS_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "count=$(printf '%s\n' "$COMMITS" | sed '/^$/d' | wc -l | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Move deploy/web-latest tag
        run: |
          git tag -f deploy/web-latest HEAD
          git push origin refs/tags/deploy/web-latest --force

  # Combines whatever deploy-backend/deploy-web actually did into a single Slack message so
  # backend and web deploys (which run independently — see the plan job's comment) never post
  # twice for a workflow that only touched one side. Runs even if one of the two was skipped or
  # failed (always()), but only posts if at least one side both succeeded AND shipped new
  # commits — a workflow_dispatch redeploy of an already-deployed SHA (e.g. after a secret
  # rotation) has count == '0' and is silently skipped, so it doesn't spam #deployments.
  notify-deploy:
    needs: [deploy-backend, deploy-web]
    if: |
      always() &&
      (needs.deploy-backend.result == 'success' || needs.deploy-web.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Build Slack message
        id: build
        env:
          BACKEND_DEPLOYED: ${{ needs.deploy-backend.result == 'success' && needs.deploy-backend.outputs.count != '0' }}
          BACKEND_COMMITS: ${{ needs.deploy-backend.outputs.commits }}
          WEB_DEPLOYED: ${{ needs.deploy-web.result == 'success' && needs.deploy-web.outputs.count != '0' }}
          WEB_COMMITS: ${{ needs.deploy-web.outputs.commits }}
        uses: actions/github-script@v7
        with:
          script: |
            const backendDeployed = process.env.BACKEND_DEPLOYED === 'true';
            const webDeployed = process.env.WEB_DEPLOYED === 'true';
            if (!backendDeployed && !webDeployed) {
              core.info('No new commits on either side — skipping Slack post.');
              core.setOutput('shouldPost', 'false');
              return;
            }
            const blocks = [
              { type: 'header', text: { type: 'plain_text', text: '🚀 e-kariyerim deploy edildi' } },
            ];
            if (backendDeployed) {
              blocks.push({ type: 'section', text: { type: 'mrkdwn', text: `*Backend (afterapply-api)*\n${process.env.BACKEND_COMMITS}` } });
            }
            if (webDeployed) {
              blocks.push({ type: 'section', text: { type: 'mrkdwn', text: `*Web (afterapply-web)*\n${process.env.WEB_COMMITS}` } });
            }
            core.setOutput('shouldPost', 'true');
            core.setOutput('payload', JSON.stringify({
              channel: 'deployments',
              text: 'e-kariyerim deploy edildi',
              blocks,
            }));

      - name: Post to #deployments
        if: steps.build.outputs.shouldPost == 'true'
        uses: slackapi/slack-github-action@v2.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: ${{ steps.build.outputs.payload }}
