name: Slack PR notifications (backend)

# Three independent notifications, all scoped to backend-affecting changes only (a PR or
# push that touches only web/ or extension/ never posts to any channel):
#   - #pr-backend: fires when a non-draft PR is opened/reopened/marked ready for review,
#     asking for a review.
#   - #pr-backend-merged: fires when a PR is merged into main.
#   - #pr-backend-merged (again): fires when someone pushes to main directly, bypassing a
#     PR entirely. Skipped if the pushed commit turns out to belong to a merged PR (squash
#     merges land as a push too), so PR merges never post twice.
# Uses a static Slack bot token (SLACK_BOT_TOKEN, xoxb-...) via chat.postMessage — no
# webhook, no token rotation/refresh to manage.

on:
  pull_request:
    types: [opened, reopened, ready_for_review, closed]
  push:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      # Only needed for the push trigger: paths-filter diffs against the GitHub API on
      # pull_request events, but needs real git history checked out to diff a push.
      - uses: actions/checkout@v4
        if: github.event_name == 'push'
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'src/**'
              - 'tests/**'
              - 'AfterApply.slnx'
              - 'Directory.Build.props'
              - 'Directory.Packages.props'
              - 'global.json'

  notify-review-requested:
    needs: changes
    if: |
      needs.changes.outputs.backend == 'true' &&
      github.event.pull_request.draft == false &&
      contains(fromJSON('["opened", "reopened", "ready_for_review"]'), github.event.action)
    runs-on: ubuntu-latest
    steps:
      - name: Post to #pr-backend
        uses: slackapi/slack-github-action@v2.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: "pr-backend"
            text: "Review bekleyen backend PR: #${{ github.event.pull_request.number }} ${{ github.event.pull_request.title }}"
            blocks:
              - type: header
                text:
                  type: plain_text
                  text: "👀 Review bekleniyor"
              - type: section
                text:
                  type: mrkdwn
                  text: "*<${{ github.event.pull_request.html_url }}|#${{ github.event.pull_request.number }} - ${{ github.event.pull_request.title }}>*"
              - type: context
                elements:
                  - type: mrkdwn
                    text: "Açan: *${{ github.event.pull_request.user.login }}*  •  `${{ github.event.pull_request.head.ref }}` → `${{ github.event.pull_request.base.ref }}`"

  notify-merged:
    needs: changes
    if: |
      needs.changes.outputs.backend == 'true' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Post to #pr-backend-merged
        uses: slackapi/slack-github-action@v2.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: "pr-backend-merged"
            text: "Backend PR main'e merge edildi: #${{ github.event.pull_request.number }} ${{ github.event.pull_request.title }}"
            blocks:
              - type: header
                text:
                  type: plain_text
                  text: "✅ main'e merge edildi"
              - type: section
                text:
                  type: mrkdwn
                  text: "*<${{ github.event.pull_request.html_url }}|#${{ github.event.pull_request.number }} - ${{ github.event.pull_request.title }}>*"
              - type: context
                elements:
                  - type: mrkdwn
                    text: "Merge eden: *${{ github.event.pull_request.merged_by.login }}*  •  Commit: <${{ github.event.repository.html_url }}/commit/${{ github.event.pull_request.merge_commit_sha }}|${{ github.event.pull_request.merge_commit_sha }}>"

  notify-direct-push:
    needs: changes
    if: |
      github.event_name == 'push' &&
      needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check whether this commit belongs to a merged PR
        id: pr-check
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
            });
            const fromMergedPr = data.some((pr) => pr.merged_at);
            core.setOutput('from-merged-pr', fromMergedPr);

      - name: Extract commit subject
        id: subject
        if: steps.pr-check.outputs.from-merged-pr == 'false'
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: echo "text=$(head -n1 <<< "$COMMIT_MESSAGE")" >> "$GITHUB_OUTPUT"

      - name: Post to #pr-backend-merged
        if: steps.pr-check.outputs.from-merged-pr == 'false'
        uses: slackapi/slack-github-action@v2.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: "pr-backend-merged"
            text: "Backend değişikliği main'e doğrudan push edildi: ${{ steps.subject.outputs.text }}"
            blocks:
              - type: header
                text:
                  type: plain_text
                  text: "⚠️ main'e doğrudan push"
              - type: section
                text:
                  type: mrkdwn
                  text: "*<${{ github.event.head_commit.url }}|${{ steps.subject.outputs.text }}>*"
              - type: context
                elements:
                  - type: mrkdwn
                    text: "Push eden: *${{ github.event.pusher.name }}*  •  Commit: `${{ github.sha }}`"
