name: CI

# Pull requests only. A push to main is covered by deploy.yml, which calls the same reusable
# workflows before it deploys — running them here as well would double every main push and, worse,
# leave the two gates able to disagree: CI and Deploy used to be independent workflows on the same
# push event, so a red main push deployed anyway. See DECISIONS.md.
on:
  pull_request:

# One CI run per pull request at a time: pushing a new commit cancels the run still chewing on the
# commit it superseded. Nothing reads that older result — the required checks are evaluated against
# the head commit — so it was already waiting on a queue slot for an answer no one would look at.
# It also happens to be the single biggest saving if this repository ever goes private, where
# runner minutes stop being free (GitHub Pro: 3,000/month) — see DECISIONS.md 2026-09-06 for the
# measurements. Deliberately NOT applied to deploy.yml: a cancel there could land in the middle of
# a `gcloud run deploy`.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  # publish stays false here: the shared Postman workspace should only ever receive a collection
  # that is actually being deployed, which is deploy.yml's call.
  api-contract:
    uses: ./.github/workflows/api-contract.yml
    with:
      publish: false
    secrets:
      POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}

  # The proof deploy.yml looks for before it skips re-running the same gates on main. Runs only
  # when every job above passed (a plain `needs:`), and names the artifact after the tree the run
  # actually tested — the pull_request checkout is GitHub's merge of the PR into main, so this is
  # the exact content that will land on main when the PR merges up to date (branch protection is
  # strict). A tree hash covers every file, workflows included, so an identical tree means an
  # identical build, identical tests and identical gate definitions. deploy.yml re-checks the run
  # itself (same repository, this workflow, concluded success) rather than trusting the name.
  # See DECISIONS.md 2026-09-26.
  verified-tree:
    needs: [tests, api-contract]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - id: tree
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          printf 'tree=%s\ncommit=%s\nrun=%s\n' "$tree" "$(git rev-parse HEAD)" "$GITHUB_RUN_ID" > verified-tree.txt

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: verified-tree-${{ steps.tree.outputs.tree }}
          path: verified-tree.txt
          retention-days: 30
