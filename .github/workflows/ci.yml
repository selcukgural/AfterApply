name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - run: dotnet restore AfterApply.slnx

      - run: dotnet build AfterApply.slnx --no-restore --configuration Release

      # Integration tests use Testcontainers, which manages its own Postgres
      # container lifecycle directly against the Docker daemon ubuntu-latest
      # already ships — no `services:` block here, that's a different
      # mechanism (a long-lived, health-check-gated container for the whole
      # job) and would be redundant/conflicting with what Testcontainers does
      # per test class.
      #
      # Tried running this in parallel on CI (tests/AfterApply.IntegrationTests/xunit.runner.json's
      # maxParallelThreads=1 was written for local dev's shared podman VM, not this dedicated
      # runner — see DECISIONS.md "CI'da integration testler artık paralel..." 2026-09-01, later
      # reverted by the same entry) — reverted: at both DOP=4 and DOP=2 it reproducibly failed a
      # different test each run (LinkedInImportTests, then EmailForwardingTests twice), all the
      # same root cause — a Hangfire background job not finishing inside a test's polling deadline
      # under real concurrent CPU load, something serial execution (DOP=1) never exercises. Back to
      # serial, matching xunit.runner.json, until that class of test is hardened.
      - run: dotnet test AfterApply.slnx --no-build --configuration Release

  api-contract:
    uses: ./.github/workflows/api-contract.yml
    # Only on main, and only once the job above is green, does the collection reach the
    # shared Postman workspace — see api-contract.yml's own "publish" step.
    with:
      publish: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    secrets:
      POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - run: npm run lint

      # Also the type-check gate — next.config.ts doesn't set
      # ignoreBuildErrors/ignoreDuringBuilds, so this fails on type errors.
      - run: npm run build

  # Dependency vulnerability gate, added by the 2026-09-03 security pass. Dependabot already opens
  # PRs for known advisories, but nothing failed a build on one — so a vulnerable transitive could
  # (and did) sit in the tree unnoticed between Dependabot runs: Hangfire.Core's floor of
  # Newtonsoft.Json 11.0.1 (GHSA-5crp-9r3c-p9vr, high) was resolving in the test projects until it
  # was pinned centrally.
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      # `dotnet list package --vulnerable` exits 0 whether or not it finds anything, so the report
      # has to be inspected rather than the exit code trusted.
      - name: Audit NuGet packages
        run: |
          dotnet restore AfterApply.slnx
          dotnet list AfterApply.slnx package --vulnerable --include-transitive | tee audit.txt
          if grep -q "has the following vulnerable packages" audit.txt; then
            echo "::error::Vulnerable NuGet package(s) found — see the report above."
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      # This one does signal through its exit code. Held at high/critical on purpose: npm's
      # low/moderate advisories are dominated by transitive dev-only findings that would make this
      # gate noise rather than signal.
      - name: Audit npm packages
        working-directory: web
        run: |
          npm ci
          npm audit --audit-level=high
