name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - run: dotnet restore AfterApply.slnx

      - run: dotnet build AfterApply.slnx --no-restore --configuration Release

      # Integration tests use Testcontainers, which manages its own Postgres
      # container lifecycle directly against the Docker daemon ubuntu-latest
      # already ships — no `services:` block here, that's a different
      # mechanism (a long-lived, health-check-gated container for the whole
      # job) and would be redundant/conflicting with what Testcontainers does
      # per test class.
      #
      # tests/AfterApply.IntegrationTests/xunit.runner.json caps maxParallelThreads at 1 — that
      # was written for local dev's shared, resource-constrained rootless-podman VM (DECISIONS.md
      # "Integration test suite: seri çalıştırma..." 2026-08-29: 24 containers starting at once
      # stalled it for 6+ minutes), not for this runner. ubuntu-latest is a dedicated 4-vCPU VM
      # with a real Docker daemon and none of that contention, so it can run several of the ~16
      # Testcontainers-backed classes at once. Overridden here via VSTest's `-- xunit.<key>=<value>`
      # passthrough (the same mechanism README.md already documents for the opposite direction)
      # instead of editing xunit.runner.json itself, so local dev's serial default is untouched.
      # TEMP diagnostic (to be removed): logs how many Testcontainers-labelled containers are
      # running every 3s while the suite runs, to confirm whether maxParallelThreads=4 actually
      # runs test classes concurrently or is being silently ignored.
      - run: |
          ( while true; do
              echo "[watch $(date +%T)] containers=$(docker ps -q --filter label=org.testcontainers=true | wc -l)"
              sleep 3
            done ) &
          WATCHER_PID=$!
          dotnet test AfterApply.slnx --no-build --configuration Release -- xunit.maxParallelThreads=4
          kill "$WATCHER_PID"

  api-contract:
    uses: ./.github/workflows/api-contract.yml
    # Only on main, and only once the job above is green, does the collection reach the
    # shared Postman workspace — see api-contract.yml's own "publish" step.
    with:
      publish: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    secrets:
      POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - run: npm run lint

      # Also the type-check gate — next.config.ts doesn't set
      # ignoreBuildErrors/ignoreDuringBuilds, so this fails on type errors.
      - run: npm run build
