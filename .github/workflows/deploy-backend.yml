name: Deploy Backend (Cloud Run)

# Sprint 13 (DECISIONS.md "5. Cloud provider"): manual trigger only, on
# purpose — the GCP project/Artifact Registry/Cloud Run service/Secret
# Manager secrets referenced below don't exist yet. Flip to `push: main`
# once the one-time setup in DEPLOYMENT.md is done; until then this
# workflow simply isn't runnable (workflow_dispatch will fail loudly on
# missing secrets, which is fine — it won't block CI on every commit).
on:
  workflow_dispatch: {}
  # push:
  #   branches: [main]

permissions:
  id-token: write # Workload Identity Federation — no long-lived JSON key stored in secrets
  contents: read

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: ${{ secrets.GCP_REGION }}
  AR_REPOSITORY: afterapply
  SERVICE_NAME: afterapply-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Build and push image
        run: |
          IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${AR_REPOSITORY}/${SERVICE_NAME}:${GITHUB_SHA}"
          docker build -f src/AfterApply.Api/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      # Values on the right of `=` are Secret Manager secret names (not the
      # secret values themselves) — see DEPLOYMENT.md for how to create
      # them. Empty-string-disables-safely secrets (Sentry, OpenAI,
      # GoogleOAuth) still go through Secret Manager for consistency, not
      # because they're sensitive when empty.
      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.GCP_REGION }}
          image: ${{ env.IMAGE }}
          env_vars: |-
            ASPNETCORE_ENVIRONMENT=Production
            ASPNETCORE_URLS=http://+:8080
          secrets: |-
            ConnectionStrings__Postgres=afterapply-postgres-connection:latest
            ConnectionStrings__Redis=afterapply-redis-connection:latest
            Jwt__SigningKey=afterapply-jwt-signing-key:latest
            Sentry__Dsn=afterapply-sentry-dsn:latest
            OpenAI__ApiKey=afterapply-openai-api-key:latest
            GoogleOAuth__ClientId=afterapply-google-oauth-client-id:latest
            GoogleOAuth__ClientSecret=afterapply-google-oauth-client-secret:latest
            GoogleOAuth__RedirectUri=afterapply-google-oauth-redirect-uri:latest
            Cors__AllowedOrigins__0=afterapply-web-origin:latest
