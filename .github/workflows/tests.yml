name: Tests

# Reusable, called from both ci.yml (on pull requests) and deploy.yml (as the gate in front of
# every deploy). Before this existed, CI and Deploy were two independent workflows on the same
# `push: main` event, so nothing made a deploy wait for the tests — a red main push deployed
# anyway. Keeping the jobs here means the PR gate and the deploy gate cannot drift apart, and
# main pushes run them once rather than once per workflow. See DECISIONS.md.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    # The whole job, restore-to-tests, took ~9 minutes before 2026-09-15 and the suite alone ~2
    # minutes after; anything past this is a hang, not a slow run.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: "10.0.x"

      - run: dotnet restore AfterApply.slnx

      - run: dotnet build AfterApply.slnx --no-restore --configuration Release

      # Integration tests use Testcontainers, which manages its own Postgres
      # container lifecycle directly against the Docker daemon ubuntu-latest
      # already ships — no `services:` block here, that's a different
      # mechanism (a long-lived, health-check-gated container for the whole
      # job) and would be redundant/conflicting with what Testcontainers does.
      #
      # --blame-hang: a test that stalls ends the run in 3 minutes with its name in the log,
      # instead of sitting there until the job's timeout-minutes cuts it off with no
      # attribution (which is what a 40-minute local hang looked like on 2026-09-15 — see
      # DECISIONS.md). Serial (xunit.runner.json, maxParallelThreads=1): the earlier parallel
      # attempts failed on Hangfire polling deadlines, which no longer exist since jobs run inline;
      # re-trying parallelism is a separate, measured change.
      - run: >
          dotnet test AfterApply.slnx --no-build --configuration Release
          --blame-hang --blame-hang-timeout 3m --blame-hang-dump-type none
          --logger "trx;LogFileName=results.trx" --results-directory TestResults

      # The console shows a failure's message but not its stack — a fixture-teardown failure
      # ("Test Class Cleanup Failure ... ObjectDisposedException", 2026-09-19) came through as
      # one line with nothing to chase. The .trx has the full trace; keep it when something failed.
      - if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: backend-test-results
          path: TestResults/*.trx
          retention-days: 14

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - run: npm run lint

      # Vitest over pure logic only (the dashboard's funnel maths, distribution scaling and number
      # formatting; the status history's display predicates). Node environment — no jsdom, no
      # component rendering.
      - run: npm test

      # Also the type-check gate — next.config.ts doesn't set
      # ignoreBuildErrors/ignoreDuringBuilds, so this fails on type errors.
      - run: npm run build

  # Dependency vulnerability gate, added by the 2026-09-03 security pass. Dependabot already opens
  # PRs for known advisories, but nothing failed a build on one — so a vulnerable transitive could
  # (and did) sit in the tree unnoticed between Dependabot runs: Hangfire.Core's floor of
  # Newtonsoft.Json 11.0.1 (GHSA-5crp-9r3c-p9vr, high) was resolving in the test projects until it
  # was pinned centrally.
  #
  # Since this workflow became the deploy gate too, a newly published advisory now blocks deploys,
  # not just merges. That is the intent of having the gate at all — shipping a known-vulnerable
  # dependency is the thing it exists to prevent — but it does mean an advisory landing mid-incident
  # blocks an unrelated hotfix until it is pinned or the job is temporarily narrowed.
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: "10.0.x"

      # `dotnet list package --vulnerable` exits 0 whether or not it finds anything, so the report
      # has to be inspected rather than the exit code trusted.
      - name: Audit NuGet packages
        run: |
          dotnet restore AfterApply.slnx
          dotnet list AfterApply.slnx package --vulnerable --include-transitive | tee audit.txt
          if grep -q "has the following vulnerable packages" audit.txt; then
            echo "::error::Vulnerable NuGet package(s) found — see the report above."
            exit 1
          fi

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      # This one does signal through its exit code. Held at high/critical on purpose: npm's
      # low/moderate advisories are dominated by transitive dev-only findings that would make this
      # gate noise rather than signal.
      - name: Audit npm packages
        working-directory: web
        run: |
          npm ci
          npm audit --audit-level=high
