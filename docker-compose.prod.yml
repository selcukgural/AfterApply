# "Prod-like" overlay over docker-compose.yml — NOT a real cloud deployment.
# Cloud provider selection is still open (DECISIONS.md); this profile is the
# locally-verifiable stand-in for the Sprint 7 DoD ("prod-benzeri ortam").
# Usage: docker compose --env-file .env.prod -f docker-compose.yml -f docker-compose.prod.yml up --build
#
# What changes vs. the dev file:
#   - Postgres/Redis no longer publish host ports (dev exposes them for local
#     psql/redis-cli access; nothing outside the compose network needs them).
#   - The API keeps its host port — the browser calls it directly (no reverse
#     proxy in this sprint, see DEPLOYMENT.md).
#   - A `web` service (Next.js, web/Dockerfile) is added.
#   - All secrets come from `.env.prod` (git-ignored) instead of dev defaults.

services:
  postgres:
    # Compose merges list fields by concatenation, not replacement, by
    # default — !override is required to actually clear the dev file's
    # published port instead of appending an empty no-op list to it.
    ports: !override []

  redis:
    ports: !override []

  api:
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Cors__AllowedOrigins__0: "${WEB_ORIGIN:?Set WEB_ORIGIN in .env.prod}"
      App__WebBaseUrl: "${WEB_ORIGIN:?Set WEB_ORIGIN in .env.prod}"
      OpenAI__ApiKey: "${OPENAI_API_KEY:-REPLACE_WITH_OPENAI_API_KEY}"
      Resend__ApiKey: "${RESEND_API_KEY:-REPLACE_WITH_RESEND_API_KEY}"
      # Both empty disables Sign in with Google (button hidden, endpoints 404) — see .env.prod.example.
      GoogleAuth__ClientId: "${GOOGLE_CLIENT_ID:-}"
      GoogleAuth__ClientSecret: "${GOOGLE_CLIENT_SECRET:-}"
      # Same "inert until set" contract as GoogleAuth, for Sign in with LinkedIn.
      LinkedInAuth__ClientId: "${LINKEDIN_CLIENT_ID:-}"
      LinkedInAuth__ClientSecret: "${LINKEDIN_CLIENT_SECRET:-}"
      # Empty disables the SDK (see .env.prod.example) — not a REPLACE_WITH_
      # placeholder, an actually-fake Dsn would make Sentry try (and fail)
      # to send an event on every request instead of silently no-op'ing.
      Sentry__Dsn: "${SENTRY_DSN:-}"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      # NEXT_PUBLIC_* vars are inlined into the client bundle at `next build`
      # time, not read at container runtime — must be build args, not
      # `environment:`. (Bulgu/finding, Sprint 13: the previous version of
      # this file passed NEXT_PUBLIC_API_BASE_URL as `environment:`, which
      # `web/Dockerfile` never declared as a build ARG, so it silently
      # baked in as `undefined` for the browser bundle — fixed here.)
      args:
        NEXT_PUBLIC_API_BASE_URL: "${API_ORIGIN:?Set API_ORIGIN in .env.prod}"
        NEXT_PUBLIC_SENTRY_DSN: "${NEXT_PUBLIC_SENTRY_DSN:-}"
    ports:
      - "3000:3000"
    depends_on:
      - api
