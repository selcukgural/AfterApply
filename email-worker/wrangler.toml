name = "ekariyerim-email-worker"
main = "src/index.js"
compatibility_date = "2026-08-30"
compatibility_flags = ["nodejs_compat"]

# Non-secret — the backend's inbound endpoint URL. Override per-environment below if needed.
[vars]
INBOUND_WEBHOOK_URL = "https://api.ekariyerim.com/api/email-forwarding/inbound"

# Secrets (never committed — set via `wrangler secret put <NAME>`):
#   INBOUND_WEBHOOK_SECRET  — must match the backend's EmailForwarding:WebhookSecret
